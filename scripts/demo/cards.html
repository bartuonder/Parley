<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parley demo cards</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(1200px 700px at 20% 10%, #1b2a4d 0%, #0f1216 60%);
    color: #e8ebef;
    font: 400 18px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: grid;
    place-items: center;
    overflow: hidden;
  }
  .stage { width: min(820px, 62vw); }
  .eyebrow { color: #6f93ff; letter-spacing: .18em; text-transform: uppercase; font-size: .8rem; font-weight: 600; }
  h1 { font-size: clamp(3rem, 7vw, 5.5rem); font-weight: 700; letter-spacing: -.02em; margin: .2em 0 .15em; }
  p.sub { font-size: clamp(1.1rem, 2.2vw, 1.6rem); color: #9aa4b1; max-width: 28em; }
  .rise { opacity: 0; transform: translateY(14px); animation: rise .7s ease-out forwards; }
  .d1 { animation-delay: .15s } .d2 { animation-delay: .45s } .d3 { animation-delay: .75s }
  @keyframes rise { to { opacity: 1; transform: none; } }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-top: 28px; }
  .fact { background: #171b21; border: 1px solid #2a313b; border-radius: 12px; padding: 20px 24px; }
  .num { font-size: clamp(2.2rem, 4.6vw, 3.4rem); font-weight: 700; color: #fff; letter-spacing: -.02em; }
  .label { color: #9aa4b1; font-size: 1rem; margin-top: 2px; }
  .note { color: #6b7684; font-size: .85rem; margin-top: 26px; }
  .tag { display: inline-block; border: 1px solid #2a313b; border-radius: 999px; padding: 4px 14px; margin: 18px 8px 0 0; color: #9aa4b1; font-size: .95rem; }
  .url { color: #6f93ff; font-size: 1.4rem; margin-top: 18px; }
  @media (prefers-reduced-motion: reduce) { .rise { animation: none; opacity: 1; transform: none; } }
</style>
</head>
<body>
<main class="stage" id="stage"></main>
<script>
  const facts = JSON.parse(new URLSearchParams(location.search).get("facts") || "[]");
  const scene = new URLSearchParams(location.search).get("scene");
  const stage = document.getElementById("stage");
  const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  if (scene === "title") {
    stage.innerHTML = `
      <div class="eyebrow rise">Eval-driven customer operations</div>
      <h1 class="rise d1">Parley</h1>
      <p class="sub rise d2">Multi-agent support tickets: policy search, tools, a policy critic, human approval, and a strict evaluation harness.</p>
      <div class="rise d3"><span class="tag">LangGraph</span><span class="tag">MCP tools</span><span class="tag">pgvector RAG</span><span class="tag">OpenTelemetry</span><span class="tag">Next.js</span></div>`;
  } else if (scene === "metrics") {
    stage.innerHTML = `
      <div class="eyebrow rise">Quality is measured</div>
      <div class="grid">${facts.map((f, i) => `<div class="fact rise" style="animation-delay:${0.15 + i * 0.18}s"><div class="num">${esc(f.value)}</div><div class="label">${esc(f.label)}</div></div>`).join("")}</div>
      <p class="note rise d3">gpt-4.1-mini, guards on, repeated runs on a synthetic world. Methods and caveats are in the README.</p>`;
  } else {
    stage.innerHTML = `
      <div class="eyebrow rise">Open source</div>
      <h1 class="rise d1">Parley</h1>
      <p class="sub rise d2">Tested, traced and measured. Every number comes with its caveat.</p>
      <p class="url rise d3">github.com/bartuonder/Parley</p>
      <p class="note rise d3">MIT license</p>`;
  }
</script>
</body>
</html>
