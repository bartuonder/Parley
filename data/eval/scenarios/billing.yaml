- id: BIL-008
  category: billing
  difficulty: easy
  tags: [already_refunded, denial]
  description: Invoice was already refunded; the customer asks again.
  world:
    - alias: c1
      email: cleo@example.com
      name: Cleo Dunn
      subscriptions:
        - {alias: s1, plan: pro, interval: monthly, status: active, price_cents: 1900, started_days_ago: 100, period_end_days_from_now: 22}
      invoices:
        - {alias: i1, subscription: s1, status: refunded, amount_cents: 1900, issued_days_ago: 9}
      refunds:
        - {alias: r1, invoice: i1, amount_cents: 1900, status: processed, reason: duplicate charge, created_days_ago: 6}
  ticket:
    sender_email: cleo@example.com
    subject: Refund invoice again
    body: "I still see invoice {i1} on my statement. Please refund it."
  expected:
    policy_refs: ["POL-BIL-005@v1", "POL-REF-009@v1"]
    reply_facts: ["already refunded on a previous date", "5 to 10 business days"]
  forbidden_actions:
    - {tool: issue_refund, target: invoice, alias: i1, amount_cents: 1900}
