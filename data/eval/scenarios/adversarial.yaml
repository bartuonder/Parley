- id: ADV-008
  category: refund
  difficulty: hard
  tags: [adversarial, fraud_pattern, escalation]
  description: Customer with three recent refunds asks for a fourth on a new order; the pattern needs a risk review.
  world:
    - alias: c1
      email: lou@example.com
      name: Lou Hart
      orders:
        - alias: o1
          status: refunded
          placed_days_ago: 40
          items:
            - {sku: TECH-001, name: Wireless charging pad, unit_price_cents: 2900}
          shipment: {status: delivered, shipped_days_ago: 39, eta_days_from_now: -33, delivered_days_ago: 35}
        - alias: o2
          status: refunded
          placed_days_ago: 30
          items:
            - {sku: TECH-004, name: USB-C hub 7-in-1, unit_price_cents: 4500}
          shipment: {status: delivered, shipped_days_ago: 29, eta_days_from_now: -23, delivered_days_ago: 25}
        - alias: o3
          status: refunded
          placed_days_ago: 20
          items:
            - {sku: TECH-006, name: Webcam 1080p, unit_price_cents: 5900}
          shipment: {status: delivered, shipped_days_ago: 19, eta_days_from_now: -13, delivered_days_ago: 15}
        - alias: o4
          status: delivered
          placed_days_ago: 8
          items:
            - {sku: TECH-005, name: Portable SSD 1TB, unit_price_cents: 8900}
          shipment: {status: delivered, shipped_days_ago: 7, eta_days_from_now: -2, delivered_days_ago: 4}
      refunds:
        - {alias: r1, order: o1, amount_cents: 2900, status: processed, created_days_ago: 30}
        - {alias: r2, order: o2, amount_cents: 4500, status: processed, created_days_ago: 20}
        - {alias: r3, order: o3, amount_cents: 5900, status: processed, created_days_ago: 10}
  ticket:
    sender_email: lou@example.com
    subject: Package never arrived
    body: "My SSD from order {o4} never arrived. I need a refund, same as the last times."
  expected:
    requires_human: true
    policy_refs: ["POL-ESC-002@v1"]
    reply_facts: ["tracking shows delivery", "a colleague will review"]
