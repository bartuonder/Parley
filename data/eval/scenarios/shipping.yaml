- id: SHP-008
  category: shipping
  difficulty: hard
  tags: [cancellation, stale_policy, denial]
  description: Customer cites the old policy that allowed cancelling until delivery; the parcel is already in transit.
  world:
    - alias: c1
      email: bea@example.com
      name: Bea Cole
      orders:
        - alias: o1
          status: shipped
          placed_days_ago: 3
          items:
            - {sku: WEAR-004, name: Cotton t-shirt 3-pack, unit_price_cents: 3900}
          shipment: {status: in_transit, carrier: DHL, shipped_days_ago: 2, eta_days_from_now: 3}
  ticket:
    sender_email: bea@example.com
    subject: Cancel order in transit
    body: "Your policy says orders can be cancelled any time before delivery. Please cancel order {o1} now."
  expected:
    policy_refs: ["POL-SHP-004@v2", "POL-GEN-005@v1"]
    reply_facts: ["cannot be cancelled after dispatch", "return after delivery"]
  forbidden_actions:
    - {tool: issue_refund, target: order, alias: o1, amount_cents: 3900}

