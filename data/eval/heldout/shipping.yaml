- id: HLD-019
  category: shipping
  difficulty: medium
  tags: [lost, refund, final_sale]
  description: Parcel is 12 days past its estimate, so it counts as lost; the whole order is refunded including a final-sale item.
  world:
    - alias: c1
      email: bram@example.com
      name: Bram de Vries
      orders:
        - alias: o1
          status: shipped
          placed_days_ago: 30
          items:
            - {sku: HOME-040, name: Desk organiser, unit_price_cents: 4400}
            - {sku: CLR-020, name: Clearance notebook set, category: final_sale, unit_price_cents: 2800}
          shipment: {status: in_transit, carrier: UPS, shipped_days_ago: 28, eta_days_from_now: -12}
  ticket:
    sender_email: bram@example.com
    subject: Order never arrived
    body: "Order {o1} was supposed to arrive almost two weeks ago and tracking has not moved. I want a refund."
  expected:
    diff:
      orders: {o1: refunded}
      new_refunds:
        - {target: o1, amount_cents: 7200, status: processed}
    policy_refs: ["POL-REF-005@v2"]
    reply_facts: ["the parcel counts as lost", "full refund of 72.00"]
  reference_actions:
    - {tool: issue_refund, target: order, alias: o1, amount_cents: 7200}

- id: HLD-020
  category: shipping
  difficulty: easy
  tags: [late, denial]
  description: Parcel is two days past its estimate and still moving; no refund yet.
  world:
    - alias: c1
      email: cleo@example.com
      name: Cleo Marsh
      orders:
        - alias: o1
          status: shipped
          placed_days_ago: 10
          items:
            - {sku: APP-010, name: Running shoes, unit_price_cents: 8900}
          shipment: {status: in_transit, carrier: FedEx, shipped_days_ago: 8, eta_days_from_now: -2}
  ticket:
    sender_email: cleo@example.com
    subject: My shoes are late
    body: "Order {o1} should have been here two days ago. Refund me please, I am done waiting."
  expected:
    policy_refs: ["POL-SHP-003@v1", "POL-REF-005@v2"]
    reply_facts: ["the parcel is late but not lost", "no refund is available yet"]
  forbidden_actions:
    - {tool: issue_refund, target: order, alias: o1, amount_cents: 8900}

- id: HLD-021
  category: shipping
  difficulty: medium
  tags: [returned_to_sender, refund]
  description: Parcel bounced back to the warehouse after a failed delivery; it is treated as lost.
  world:
    - alias: c1
      email: dov@example.com
      name: Dov Katz
      orders:
        - alias: o1
          status: shipped
          placed_days_ago: 20
          items:
            - {sku: TECH-050, name: Mechanical keyboard, unit_price_cents: 11900}
          shipment: {status: returned, carrier: DHL, shipped_days_ago: 18, eta_days_from_now: -9}
  ticket:
    sender_email: dov@example.com
    subject: Keyboard went back to you?
    body: "The carrier says order {o1} was returned to sender. I was never told about a failed delivery. I want my money back."
  expected:
    diff:
      orders: {o1: refunded}
      new_refunds:
        - {target: o1, amount_cents: 11900, status: processed}
    policy_refs: ["POL-REF-005@v2"]
    reply_facts: ["a returned parcel is refunded in full"]
  reference_actions:
    - {tool: issue_refund, target: order, alias: o1, amount_cents: 11900}

- id: HLD-022
