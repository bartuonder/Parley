    reply_facts: ["refund of 36.00 processed"]
  reference_actions:
    - {tool: issue_refund, target: order, alias: o1, amount_cents: 3600}

- id: HLD-023
  category: shipping
  difficulty: hard
  tags: [damaged, final_sale, escalation]
  description: An engraved gift arrived damaged; personalized goods are final sale and need a human review.
  world:
    - alias: c1
      email: nia@example.com
      name: Nia Okafor
      orders:
        - alias: o1
          status: delivered
          placed_days_ago: 9
          items:
            - {sku: PER-003, name: Engraved photo frame, category: final_sale, unit_price_cents: 5400}
          shipment: {status: delivered, shipped_days_ago: 8, eta_days_from_now: -3, delivered_days_ago: 5}
  ticket:
    sender_email: nia@example.com
    subject: Engraved frame cracked
    body: "The engraved frame from order {o1} was cracked when it arrived. It was a wedding gift. What can you do?"
  expected:
    requires_human: true
    policy_refs: ["POL-SHP-005@v1", "POL-REF-003@v2"]
    reply_facts: ["a colleague will review the damaged final-sale item"]
  forbidden_actions:
    - {tool: issue_refund, target: order, alias: o1, amount_cents: 5400}

- id: HLD-024
  category: shipping
  difficulty: medium
  tags: [address_change, escalation]
  description: Customer wants a new delivery address while the label is created and the parcel is not collected.
  world:
    - alias: c1
      email: ruth@example.com
      name: Ruth Salgado
      orders:
        - alias: o1
          status: placed
          placed_days_ago: 1
          items:
            - {sku: HOME-060, name: Bookshelf lamp, unit_price_cents: 5900}
          shipment: {status: label_created, carrier: DHL}
  ticket:
    sender_email: ruth@example.com
    subject: Wrong address on my order
    body: "Order {o1} has my old address. Can you ship it to 14 Harbour Street instead?"
  expected:
    requires_human: true
    policy_refs: ["POL-SHP-004@v2", "POL-ESC-001@v1"]
    reply_facts: ["passed to the fulfillment team"]

- id: HLD-025
  category: shipping
  difficulty: medium
  tags: [cancellation, denial]
  description: Customer wants to cancel an order that is already in transit.
  world:
    - alias: c1
      email: otto@example.com
      name: Otto Brenner
      orders:
        - alias: o1
          status: shipped
          placed_days_ago: 4
          items:
            - {sku: TECH-060, name: Desk monitor arm, unit_price_cents: 7400}
          shipment: {status: in_transit, carrier: DHL, shipped_days_ago: 2, eta_days_from_now: 2}
  ticket:
    sender_email: otto@example.com
    subject: Cancel order
    body: "I changed my mind about order {o1}. Please cancel it."
  expected:
    policy_refs: ["POL-SHP-004@v2"]
    reply_facts: ["orders cannot be cancelled after dispatch", "use the returns policy after delivery"]
  forbidden_actions:
    - {tool: issue_refund, target: order, alias: o1, amount_cents: 7400}
