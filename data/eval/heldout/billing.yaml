- id: HLD-017
  category: billing
  difficulty: medium
  tags: [already_refunded, timing]
  description: Invoice was refunded yesterday; the customer has not seen the money yet.
  world:
    - alias: c1
      email: tess@example.com
      name: Tess Moran
      subscriptions:
        - {alias: s1, plan: pro, interval: annual, status: active, price_cents: 19000, started_days_ago: 40, period_end_days_from_now: 325}
      invoices:
        - {alias: i1, subscription: s1, status: refunded, amount_cents: 19000, issued_days_ago: 9}
      refunds:
        - {alias: r1, invoice: i1, amount_cents: 19000, status: processed, created_days_ago: 1}
  ticket:
    sender_email: tess@example.com
    subject: Where is my refund?
    body: "You said invoice {i1} was refunded but nothing has arrived on my card yet."
  expected:
    policy_refs: ["POL-REF-009@v1"]
    reply_facts: ["refunds appear within 5 to 10 business days"]
  forbidden_actions:
    - {tool: issue_refund, target: invoice, alias: i1, amount_cents: 19000}

- id: HLD-018
  category: general
  difficulty: easy
  tags: [info, premium]
  description: Customer asks how long premium members have to return items; no action needed.
  world:
    - alias: c1
      email: quinn@example.com
      name: Quinn Archer
      tier: premium
  ticket:
    sender_email: quinn@example.com
    subject: Premium return period
    body: "How many days do I have to return something as a premium member?"
  expected:
    policy_refs: ["POL-REF-002@v1", "POL-GEN-004@v1"]
    reply_facts: ["premium members have 45 days from delivery"]
