  description: Customer wants the company name and address changed on a past invoice.
  world:
    - alias: c1
      email: sven@example.com
      name: Sven Aaltonen
      subscriptions:
        - {alias: s1, plan: team, interval: monthly, status: active, price_cents: 4900, started_days_ago: 90, period_end_days_from_now: 12}
      invoices:
        - {alias: i1, subscription: s1, status: paid, amount_cents: 4900, issued_days_ago: 18}
  ticket:
