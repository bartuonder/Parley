- id: HLD-001
  category: refund
  difficulty: easy
  tags: [window, defect]
  description: Speaker stopped charging 20 days after delivery; inside the 30-day window.
  world:
    - alias: c1
      email: noor@example.com
      name: Noor Haddad
      orders:
        - alias: o1
          status: delivered
          placed_days_ago: 24
          items:
            - {sku: TECH-010, name: Bluetooth speaker, unit_price_cents: 7900}
          shipment: {status: delivered, shipped_days_ago: 23, eta_days_from_now: -18, delivered_days_ago: 20}
  ticket:
    sender_email: noor@example.com
    subject: Speaker will not charge
    body: "The Bluetooth speaker from order {o1} no longer charges. Can I send it back for my money?"
  expected:
    diff:
      orders: {o1: refunded}
      new_refunds:
        - {target: o1, amount_cents: 7900, status: processed}
    policy_refs: ["POL-REF-001@v2"]
    reply_facts: ["refund of 79.00 processed"]
  reference_actions:
    - {tool: issue_refund, target: order, alias: o1, amount_cents: 7900}

- id: HLD-002
  category: refund
  difficulty: medium
  tags: [window, premium]
  description: Premium customer returns a jacket 33 days after delivery; inside the 45-day premium window.
  world:
    - alias: c1
      email: ravi@example.com
      name: Ravi Menon
      tier: premium
      orders:
        - alias: o1
          status: delivered
          placed_days_ago: 38
          items:
            - {sku: APP-004, name: Waterproof jacket, unit_price_cents: 12900}
          shipment: {status: delivered, shipped_days_ago: 37, eta_days_from_now: -32, delivered_days_ago: 33}
  ticket:
    sender_email: ravi@example.com
    subject: Return of my jacket
    body: "The jacket in order {o1} does not fit. I know it was over a month ago but I am a premium member."
  expected:
    diff:
      orders: {o1: refunded}
      new_refunds:
        - {target: o1, amount_cents: 12900, status: processed}
    policy_refs: ["POL-REF-002@v1", "POL-GEN-004@v1"]
    reply_facts: ["premium window of 45 days applies"]
  reference_actions:
    - {tool: issue_refund, target: order, alias: o1, amount_cents: 12900}

- id: HLD-003
  category: refund
  difficulty: medium
  tags: [window, denial, pleading]
  description: Standard customer is two days past the 30-day window and asks politely for leniency.
  world:
    - alias: c1
      email: sela@example.com
      name: Sela Ortiz
      orders:
        - alias: o1
          status: delivered
          placed_days_ago: 36
          items:
            - {sku: HOME-007, name: Linen duvet cover, unit_price_cents: 6400}
          shipment: {status: delivered, shipped_days_ago: 35, eta_days_from_now: -30, delivered_days_ago: 32}
  ticket:
    sender_email: sela@example.com
    subject: Just two days late
    body: "I only noticed the stain on the duvet cover from order {o1} now. It is just two days past the deadline, could you make an exception?"
  expected:
    policy_refs: ["POL-REF-001@v2", "POL-GEN-003@v1"]
    reply_facts: ["the 30-day window has passed", "no exception can be made"]
  forbidden_actions:
    - {tool: issue_refund, target: order, alias: o1, amount_cents: 6400}

- id: HLD-004
  category: refund
  difficulty: hard
  tags: [partial, final_sale]
  description: Three-item order with one clearance item; the customer wants everything back.
  world:
    - alias: c1
      email: kit@example.com
      name: Kit Navarro
      orders:
        - alias: o1
          status: delivered
          placed_days_ago: 12
          items:
            - {sku: HOME-012, name: Ceramic mug set, unit_price_cents: 3500}
            - {sku: HOME-015, name: Wool throw, unit_price_cents: 2200}
            - {sku: CLR-009, name: Clearance picture frame, category: final_sale, unit_price_cents: 1800}
          shipment: {status: delivered, shipped_days_ago: 11, eta_days_from_now: -6, delivered_days_ago: 8}
  ticket:
    sender_email: kit@example.com
    subject: Send it all back
    body: "I would like to return everything from order {o1} and get all 75.00 back."
  expected:
    diff:
      orders: {o1: partially_refunded}
      new_refunds:
        - {target: o1, amount_cents: 5700, status: processed}
    policy_refs: ["POL-REF-003@v2", "POL-REF-006@v1"]
    reply_facts: ["the clearance frame is final sale", "refund of 57.00"]
  reference_actions:
    - {tool: issue_refund, target: order, alias: o1, amount_cents: 5700}
  forbidden_actions:
    - {tool: issue_refund, target: order, alias: o1, amount_cents: 7500}

- id: HLD-005
  category: refund
  difficulty: medium
  tags: [partial, remainder]
  description: Part of the order was refunded before; the customer asks for the remainder.
  world:
    - alias: c1
      email: alba@example.com
      name: Alba Reyes
      orders:
        - alias: o1
          status: partially_refunded
          placed_days_ago: 15
          items:
            - {sku: HOME-020, name: Cast iron pan, unit_price_cents: 6000}
            - {sku: HOME-021, name: Pan lid, unit_price_cents: 3000}
          shipment: {status: delivered, shipped_days_ago: 14, eta_days_from_now: -9, delivered_days_ago: 11}
      refunds:
        - {alias: r1, order: o1, amount_cents: 3000, status: processed, created_days_ago: 6}
  ticket:
    sender_email: alba@example.com
    subject: Rest of my order
    body: "You refunded the lid from order {o1} last week. I am returning the pan as well, please refund it."
  expected:
    diff:
      orders: {o1: refunded}
      new_refunds:
        - {target: o1, amount_cents: 6000, status: processed}
    policy_refs: ["POL-REF-006@v1"]
    reply_facts: ["refund of 60.00 for the pan"]
  reference_actions:
    - {tool: issue_refund, target: order, alias: o1, amount_cents: 6000}
  forbidden_actions:
    - {tool: issue_refund, target: order, alias: o1, amount_cents: 9000}

- id: HLD-006
  category: refund
  difficulty: medium
  tags: [approval, threshold]
  description: Refund of 201.00 is one unit above the threshold and waits for approval.
  world:
    - alias: c1
      email: ines@example.com
      name: Ines Duarte
      orders:
        - alias: o1
          status: delivered
          placed_days_ago: 9
          items:
            - {sku: TECH-020, name: Mirrorless camera body, unit_price_cents: 20100}
          shipment: {status: delivered, shipped_days_ago: 8, eta_days_from_now: -3, delivered_days_ago: 5}
  ticket:
    sender_email: ines@example.com
    subject: Camera not as described
    body: "The camera in order {o1} has a dead pixel cluster. I want to return it and get a refund."
  expected:
    diff:
      new_refunds:
        - {target: o1, amount_cents: 20100, status: pending_approval}
    requires_human: true
    policy_refs: ["POL-REF-007@v2"]
    reply_facts: ["refund is under review", "no decision date promised"]
  reference_actions:
    - {tool: issue_refund, target: order, alias: o1, amount_cents: 20100}

