  reference_actions:
    - {tool: issue_refund, target: order, alias: o1, amount_cents: 4900}

- id: DLG-012
  category: subscription
  difficulty: hard
  tags: [dialogue, two_requests, lost, cancel]
  description: A refund for a lost parcel first, then a cancellation request once the refund is confirmed; the subscription specialist holds both tools.
  world:
    - alias: c1
      email: mona@example.com
      name: Mona Reyes
      orders:
        - alias: o1
          status: shipped
          placed_days_ago: 35
          items:
            - {sku: TECH-095, name: Webcam kit, unit_price_cents: 6800}
          shipment: {status: lost, carrier: DHL, shipped_days_ago: 33, eta_days_from_now: -22}
      subscriptions:
        - {alias: s1, plan: pro, interval: monthly, status: active, price_cents: 1900, started_days_ago: 250, period_end_days_from_now: 13}
  ticket:
    sender_email: mona@example.com
    subject: Webcam kit lost
    body: "The carrier lost my webcam kit from order {o1}. I want my money back."
  dialogue:
    persona: Calm and organised; you raise one thing at a time.
    goal: Get the lost parcel refunded and then cancel the Pro plan {s1}.
    facts:
      - "Only after the refund is confirmed you also ask to cancel your Pro plan {s1}"
  expected:
    diff:
      orders: {o1: refunded}
      subscriptions: {s1: {cancel_at_period_end: true}}
      new_refunds:
        - {target: o1, amount_cents: 6800, status: processed}
    policy_refs: ["POL-REF-005@v2", "POL-SUB-002@v2"]
    reply_facts: ["refund of 68.00 processed", "the plan is cancelled"]
  reference_actions:
    - {tool: issue_refund, target: order, alias: o1, amount_cents: 6800}
    - {tool: cancel_subscription, alias: s1}

