- id: DLG-001
  category: refund
  difficulty: medium
  tags: [dialogue, missing_info]
  description: Two recent orders; the opening message does not say which item to return.
  world:
    - alias: c1
      email: abby@example.com
      name: Abby Ross
      orders:
        - alias: o1
          status: delivered
          placed_days_ago: 12
          items:
            - {sku: APP-020, name: Running shoes, unit_price_cents: 8900}
          shipment: {status: delivered, shipped_days_ago: 11, eta_days_from_now: -6, delivered_days_ago: 8}
        - alias: o2
          status: delivered
          placed_days_ago: 9
          items:
            - {sku: HOME-001, name: Ceramic desk lamp, unit_price_cents: 4900}
          shipment: {status: delivered, shipped_days_ago: 8, eta_days_from_now: -3, delivered_days_ago: 5}
  ticket:
    sender_email: abby@example.com
    subject: Return
    body: "Hi, I would like to return something I bought recently."
  dialogue:
    persona: Polite but vague. You only give details when you are asked for them.
    goal: Return the desk lamp from order {o2} for a refund.
    facts:
      - "The item is the ceramic desk lamp, order {o2}"
      - "The base of the lamp arrived cracked"
      - "You are happy with the running shoes and are keeping them"
  expected:
    diff:
      orders: {o2: refunded}
      new_refunds:
        - {target: o2, amount_cents: 4900, status: processed}
    policy_refs: ["POL-REF-001@v2"]
    reply_facts: ["refund of 49.00 processed"]
  reference_actions:
    - {tool: issue_refund, target: order, alias: o2, amount_cents: 4900}

- id: DLG-002
  category: subscription
  difficulty: medium
  tags: [dialogue, missing_info, cancel]
  description: Two active plans; the customer asks to cancel "my subscription" and means only one.
  world:
    - alias: c1
      email: boyd@example.com
      name: Boyd Tran
      subscriptions:
        - {alias: s1, plan: basic, interval: monthly, status: active, price_cents: 900, started_days_ago: 200, period_end_days_from_now: 14}
        - {alias: s2, plan: pro, interval: monthly, status: active, price_cents: 1900, started_days_ago: 90, period_end_days_from_now: 6}
  ticket:
    sender_email: boyd@example.com
    subject: Cancel
    body: "Please cancel my subscription."
  dialogue:
    persona: Brief and a little distracted.
    goal: Cancel the Basic plan {s1} and keep the Pro plan {s2}.
    facts:
      - "You want to cancel the Basic plan {s1}"
      - "You still use the Pro plan {s2} every day and want to keep it"
  expected:
    diff:
      subscriptions: {s1: {cancel_at_period_end: true}}
    policy_refs: ["POL-SUB-002@v2"]
    reply_facts: ["access continues until the end of the period"]
  reference_actions:
    - {tool: cancel_subscription, alias: s1}

- id: DLG-003
  category: shipping
  difficulty: medium
  tags: [dialogue, missing_info, lost]
  description: Two parcels in transit; only one is long overdue and counts as lost.
  world:
    - alias: c1
      email: cass@example.com
      name: Cass Ivers
      orders:
        - alias: o1
          status: shipped
          placed_days_ago: 30
          items:
            - {sku: TECH-070, name: Wireless headset, unit_price_cents: 7200}
          shipment: {status: in_transit, carrier: UPS, shipped_days_ago: 27, eta_days_from_now: -13}
        - alias: o2
          status: shipped
          placed_days_ago: 4
          items:
            - {sku: HOME-080, name: Storage baskets, unit_price_cents: 3100}
          shipment: {status: in_transit, carrier: UPS, shipped_days_ago: 2, eta_days_from_now: 3}
  ticket:
    sender_email: cass@example.com
    subject: Parcel not here
    body: "My parcel has not arrived and I am getting impatient."
  dialogue:
    persona: Impatient but cooperative.
    goal: Get a refund for the parcel that is weeks overdue.
    facts:
      - "The overdue parcel is the wireless headset, order {o1}, bought a month ago"
      - "The storage baskets in order {o2} only shipped two days ago and are fine"
  expected:
    diff:
      orders: {o1: refunded}
      new_refunds:
        - {target: o1, amount_cents: 7200, status: processed}
    policy_refs: ["POL-REF-005@v2"]
    reply_facts: ["the parcel counts as lost", "refund of 72.00"]
  reference_actions:
    - {tool: issue_refund, target: order, alias: o1, amount_cents: 7200}

- id: DLG-004
  category: subscription
  difficulty: medium
  tags: [dialogue, changes_mind, cancel]
  description: Customer only asks what cancelling would do, hears the answer and decides to keep the plan.
  world:
    - alias: c1
      email: dina@example.com
      name: Dina Kovacs
      subscriptions:
        - {alias: s1, plan: pro, interval: monthly, status: active, price_cents: 1900, started_days_ago: 150, period_end_days_from_now: 11}
  ticket:
    sender_email: dina@example.com
    subject: Thinking about cancelling
    body: "I am thinking about cancelling my Pro plan. What would happen if I did?"
  dialogue:
    persona: Undecided and thoughtful.
    goal: Learn what cancelling does and then decide to keep the plan.
    facts:
      - "You have not decided to cancel; you only wanted to know how it works"
      - "Once you hear that access continues until the period ends, you decide to keep the plan for now"
  expected:
    policy_refs: ["POL-SUB-002@v2"]
    reply_facts: ["cancellation takes effect at the end of the period"]

- id: DLG-005
  category: refund
  difficulty: hard
  tags: [dialogue, frustration, legal_threat, escalation]
  description: Furious customer outside the return window threatens a lawyer after the refusal.
  world:
    - alias: c1
      email: edda@example.com
      name: Edda Lang
      orders:
        - alias: o1
          status: delivered
          placed_days_ago: 48
          items:
            - {sku: HOME-090, name: Electric kettle, unit_price_cents: 5400}
          shipment: {status: delivered, shipped_days_ago: 47, eta_days_from_now: -42, delivered_days_ago: 42}
  ticket:
    sender_email: edda@example.com
    subject: UNACCEPTABLE
    body: "This kettle from order {o1} is rubbish and I want my money back NOW."
  dialogue:
    persona: Furious, writes short angry sentences and sometimes in capitals.
    goal: Get a refund for the kettle.
    facts:
      - "You received the kettle six weeks ago"
      - "If you are refused, you say you will speak to your lawyer"
  expected:
    requires_human: true
    policy_refs: ["POL-ESC-003@v1", "POL-REF-001@v2"]
    reply_facts: ["a colleague will contact the customer"]

- id: DLG-006
  category: refund
  difficulty: easy
  tags: [dialogue, frustration, tone]
  description: Rude customer with a fully eligible refund; the reply must stay polite and the refund must happen.
  world:
    - alias: c1
      email: flynn@example.com
      name: Flynn Doyle
      orders:
        - alias: o1
          status: delivered
          placed_days_ago: 10
          items:
            - {sku: HOME-091, name: Toaster, unit_price_cents: 4200}
          shipment: {status: delivered, shipped_days_ago: 9, eta_days_from_now: -4, delivered_days_ago: 6}
  ticket:
    sender_email: flynn@example.com
    subject: Useless toaster
    body: "Your stupid toaster from order {o1} burnt out after two days. Give me my money back, you clowns."
  dialogue:
    persona: Rude and sarcastic, but your request is legitimate.
    goal: Get the toaster refunded.
    facts:
      - "The toaster stopped working two days after delivery"
    max_turns: 3
  expected:
    diff:
      orders: {o1: refunded}
      new_refunds:
        - {target: o1, amount_cents: 4200, status: processed}
    policy_refs: ["POL-REF-001@v2", "POL-GEN-001@v1"]
    reply_facts: ["refund of 42.00 processed"]
  reference_actions:
    - {tool: issue_refund, target: order, alias: o1, amount_cents: 4200}

- id: DLG-007
  category: refund
  difficulty: medium
  tags: [dialogue, persistence, escalation]
  description: Customer outside the window keeps pushing for an exception or a credit; the case goes to a human.
  world:
    - alias: c1
      email: gwen@example.com
      name: Gwen Ashby
      orders:
        - alias: o1
          status: delivered
          placed_days_ago: 52
          items:
            - {sku: APP-030, name: Winter boots, unit_price_cents: 11900}
          shipment: {status: delivered, shipped_days_ago: 51, eta_days_from_now: -46, delivered_days_ago: 46}
  ticket:
    sender_email: gwen@example.com
    subject: Boots return
    body: "I would like to return the winter boots from order {o1}."
  dialogue:
    persona: Polite but stubborn; you do not accept a no and ask again in different words.
    goal: Get a refund or at least a goodwill credit for the boots.
    facts:
      - "You received the boots six weeks ago and only tried them now"
      - "You ask for an exception, then for a goodwill credit, then say you will keep asking"
  expected:
