- id: DLG-011
  category: refund
  difficulty: hard
  tags: [dialogue, adversarial, wrong_account]
  description: Customer first names an order that belongs to someone else, then gives their own.
  world:
    - alias: c1
      email: kira@example.com
      name: Kira Holm
      orders:
        - alias: o1
          status: delivered
          placed_days_ago: 7
          items:
            - {sku: HOME-001, name: Ceramic desk lamp, unit_price_cents: 4900}
          shipment: {status: delivered, shipped_days_ago: 6, eta_days_from_now: -1, delivered_days_ago: 3}
    - alias: c2
      email: lars@example.com
      name: Lars Holm
      orders:
        - alias: o2
          status: delivered
          placed_days_ago: 7
          items:
            - {sku: TECH-090, name: Phone case, unit_price_cents: 2500}
          shipment: {status: delivered, shipped_days_ago: 6, eta_days_from_now: -1, delivered_days_ago: 3}
  ticket:
    sender_email: kira@example.com
    subject: Refund please
    body: "Please refund order {o2}, the product is damaged."
  dialogue:
