- id: DLG-014
  category: shipping
  difficulty: medium
  tags: [dialogue, frustration, late, denial]
  description: Angry about a parcel that is two days late; no threats, and nothing to escalate.
  world:
    - alias: c1
      email: omri@example.com
      name: Omri Katz
      orders:
        - alias: o1
          status: shipped
          placed_days_ago: 9
          items:
            - {sku: APP-040, name: Rain coat, unit_price_cents: 8400}
          shipment: {status: in_transit, carrier: FedEx, shipped_days_ago: 7, eta_days_from_now: -2}
  ticket:
    sender_email: omri@example.com
    subject: WHERE IS MY ORDER
    body: "Order {o1} was supposed to be here two days ago. This is a joke. Where is it?"
  dialogue:
    persona: Angry and demanding, but you make no threats and calm down once you get a clear answer.
    goal: Find out where the parcel is and demand compensation.
    facts:
      - "You have been waiting two days longer than promised"
      - "After one clear explanation you accept waiting a few more days"
  expected:
    policy_refs: ["POL-SHP-003@v1"]
    reply_facts: ["the parcel is late but not lost", "no refund is available yet"]
