          status: delivered
          placed_days_ago: 9
          items:
            - {sku: HOME-132, name: Ceramic desk lamp, unit_price_cents: 4900}
          shipment: {status: delivered, shipped_days_ago: 8, eta_days_from_now: -3, delivered_days_ago: 5}
